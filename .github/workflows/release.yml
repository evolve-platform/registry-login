name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json must contain a stable version such as 1.0.0"
            exit 1
          fi
          tag="v$version"
          major="v${version%%.*}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "::error::$tag already exists on a different commit; bump package.json"
              exit 1
            fi
          fi
          latest=$(git tag --list "$major.*" --sort=-version:refname | head -n 1)
          if [[ -n "$latest" && "$(printf '%s\n' "$latest" "$tag" | sort -V | tail -n 1)" != "$tag" ]]; then
            echo "::error::Refusing to move $major backwards from $latest to $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

      - name: Verify committed bundle
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- dist/)" ]]; then
            git diff -- dist/
            echo "::error::Run pnpm build and commit dist/ before releasing"
            exit 1
          fi

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

      - name: Update major version tag
        env:
          MAJOR: ${{ steps.version.outputs.major }}
        shell: bash
        run: git push origin "+$GITHUB_SHA:refs/tags/$MAJOR"
