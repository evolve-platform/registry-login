name: Login to evolve-registry
description: Exchange a GitHub Actions OIDC token for an evolve-registry token and write it to .npmrc

inputs:
  registry-url:
    description: "Registry base URL (used as OIDC audience and token exchange host)"
    default: "https://registry.evolve-platform.com"
  npm-registry-host:
    description: "Hostname written to .npmrc for npm auth"
    default: "npm.registry.evolve-platform.com"
  npmrc-path:
    description: "Path to the .npmrc file to append the auth token to"
    default: ".npmrc"

outputs:
  token:
    description: "Exchanged evolve-registry token"
    value: ${{ steps.exchange.outputs.token }}

runs:
  using: "composite"
  steps:
    - name: Exchange OIDC token for registry token
      id: exchange
      shell: bash
      env:
        REGISTRY_URL: ${{ inputs.registry-url }}
        NPM_REGISTRY_HOST: ${{ inputs.npm-registry-host }}
        NPMRC_PATH: ${{ inputs.npmrc-path }}
      run: |
        GITHUB_OIDC_TOKEN=$(curl -sSL \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$REGISTRY_URL" \
          | jq -r '.value')

        REGISTRY_TOKEN=$(curl -sSL -X POST \
          "$REGISTRY_URL/api/v1/tokens/exchange" \
          -H "Content-Type: application/json" \
          -d "{\"token\": \"$GITHUB_OIDC_TOKEN\", \"provider\": \"github-actions\"}" \
          | jq -r '.token')

        echo "::add-mask::$REGISTRY_TOKEN"
        echo "token=$REGISTRY_TOKEN" >> "$GITHUB_OUTPUT"
        echo "//$NPM_REGISTRY_HOST/:_authToken=$REGISTRY_TOKEN" >> "$NPMRC_PATH"
